<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>MICROCOSMOS — Lobby</title>
<style>
:root{--paper:#efe5cc;--paper2:#fff8e7;--ink:#30271e;--leaf:#356342;--gold:#b58a3d;--line:#8c7552;--dark:#25283d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,"Times New Roman",serif;background:radial-gradient(circle at 50% 0,#294536,#07100b 72%);color:var(--ink)}button,input,select{font:inherit}.app{width:min(980px,100%);margin:auto;padding:14px}.head,.panel{background:var(--paper);border:4px double #9a7844;border-radius:22px;padding:16px;box-shadow:0 16px 50px #0008}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.head h1{margin:0;color:#405d3e;font-size:clamp(1.45rem,5vw,2.25rem)}.head-actions,.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--paper2);color:var(--ink);font-weight:bold;text-decoration:none;cursor:pointer}.btn.primary{background:var(--leaf);color:#fff}.btn.dark{background:var(--dark);color:#fff}.panel{margin-top:12px}.room-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin:12px 0}.room{background:var(--paper2);border:2px solid #aa9472;border-radius:15px;padding:12px;display:grid;gap:8px}.room h3{margin:0;color:#405d3e}.code{font-family:monospace;letter-spacing:.1em;background:#ead9b5;border-radius:7px;padding:3px 7px;width:max-content}.muted{color:#75654e;font-size:.82rem}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.form[hidden]{display:none!important}.form label,.owner-settings label{display:grid;gap:4px}.wide{grid-column:1/-1}.form input,.form select,.owner-settings select{width:100%;padding:11px;border:1px solid #9c8765;border-radius:10px;background:#fffaf0}.owner-settings{border-top:1px dashed #aa9472;padding-top:8px;display:grid;gap:7px}.owner-settings .publish{display:flex;align-items:center;gap:7px}.owner-settings .publish input{width:18px;height:18px}.error{color:#913f3d;font-weight:bold;min-height:1.3em;margin-top:8px}.empty{text-align:center;padding:18px;background:#fff8e7;border-radius:12px}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#07100b;color:#f3dfaa;font-size:1.2rem;z-index:20}.loading[hidden]{display:none}.notice{background:#fff4d7;border-left:5px solid var(--gold);padding:9px;border-radius:8px;margin:10px 0}@media(max-width:620px){.app{padding:7px}.head{align-items:flex-start;border-radius:16px}.panel{padding:12px;border-radius:16px}.form{grid-template-columns:1fr}.wide{grid-column:auto}.room-list{grid-template-columns:1fr}.btn{min-height:44px}.actions .btn{flex:1}}
.member-overlay{position:fixed;inset:0;z-index:30;background:#07100bdd;display:grid;place-items:center;padding:10px}.member-overlay[hidden]{display:none}.member-panel{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--paper);border:4px double #9a7844;border-radius:18px;padding:14px}.member-row{background:var(--paper2);border:1px solid #aa9472;border-radius:11px;padding:9px;margin:7px 0}.member-row .actions{margin-top:7px}.btn.danger{background:#914744;color:#fff}
.danger-zone{border:1px solid #b96a65;border-radius:10px;padding:8px;background:#fff0ea;display:grid;gap:7px}.danger-zone summary{cursor:pointer;color:#7c302d;font-weight:bold}.archived{opacity:.88;border-style:dashed}
</style></head><body>
<div id="loading" class="loading">🏰 Carregando suas campanhas…</div>
<main class="app">
<header class="head"><div><h1>🏰 Lobby de Campanhas</h1><div id="welcome" class="muted">Escolha onde sua aventura continua.</div></div><div class="head-actions"><a class="btn" href="index.html?from=lobby">📜 Minha ficha</a><button class="btn" id="logout">Sair</button></div></header>
<section class="panel"><h2>Suas campanhas</h2><div id="myRooms" class="room-list"></div><div id="legacy"></div></section>
<section class="panel"><h2>Salas públicas</h2><p class="muted">Campanhas abertas para novos participantes. Salas com senha pedem a senha ao entrar.</p><div id="publicRooms" class="room-list"></div></section>
<section class="panel"><div class="tabs"><button class="btn primary" data-tab="create">＋ Criar sala</button><button class="btn" data-tab="join">🔑 Entrar com código</button></div>
<form id="create" class="form"><label class="wide">Nome da sala<input name="name" required minlength="2" maxlength="80" placeholder="Ex.: A Torre do Vale"></label><label>Limite de pessoas<input name="limit" type="number" min="1" max="30" value="6"></label><label>Senha opcional<input name="password" type="password" minlength="4" autocomplete="new-password"></label><label class="wide">Quem conduz<select name="mode"><option value="human">Mestre humano</option><option value="assisted">Mestre com ajuda da IA</option><option value="ai">Mestre Bot com IA — será ativado depois</option></select></label><button class="btn primary wide" type="submit">Criar sala</button></form>
<form id="join" class="form" hidden><label>Código da sala<input name="code" required maxlength="12" autocomplete="off"></label><label>Senha, se houver<input name="password" type="password" autocomplete="current-password"></label><button class="btn primary wide" type="submit">Entrar na sala</button></form><div id="error" class="error"></div>
</section></main><div id="memberOverlay" class="member-overlay" hidden><section class="member-panel"><div class="head-actions"><h2 id="memberTitle" style="margin-right:auto">Participantes</h2><button class="btn" id="closeMembers">Fechar</button></div><div id="memberList"></div></section></div>
<script type="module">
import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const client=createClient("https://evyhhlbvhspiuwouivbb.supabase.co","sb_publishable_mf7PV03HfaJw_YkUhX34NA_dAGFbyp6",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}),STORE="MICROCOSMOS_ACTIVE_ROOM_V1",LEGACY="microcosmos-main",$=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),mode=m=>m==="ai"?"Mestre Bot IA":m==="assisted"?"Mestre + ajuda da IA":"Mestre humano";
let profile,myRooms=[],publicRooms=[],pendingNotice="";const fail=m=>$("error").textContent=m||"";
function openRoom(id,name){localStorage.setItem(STORE,JSON.stringify({roomId:id,roomName:name||"Mesa atual"}));location.href="mesa-campanha.html"}
async function join(code,hasPassword,passwordOverride=null){let password=passwordOverride;if(hasPassword&&password===null){password=prompt("Esta sala possui senha:");if(password===null)return}const{data,error}=await client.rpc("join_room",{p_room_code:code,p_password:password});if(error)throw error;if(data?.[0]?.member_role==="pending"){alert("Solicitação enviada. Aguarde a autorização do Mestre.");await reload();return}if(data?.[0])openRoom(data[0].room_id,data[0].room_name)}
function ownerControls(r){if(!r.is_owner)return"";if(r.room_status==="archived")return`<div class="owner-settings"><b>Campanha arquivada</b><div class="muted">Mapas, fichas da mesa e participantes estão preservados.</div><button class="btn primary" data-restore="${esc(r.room_id)}">↩ Restaurar campanha</button><details class="danger-zone"><summary>Zona de perigo</summary><button class="btn danger" data-delete="${esc(r.room_id)}">Excluir definitivamente</button></details></div>`;return`<div class="owner-settings"><b>Controle do criador</b><label>Condução<select data-mode="${esc(r.room_id)}"><option value="human" ${r.master_mode==="human"?"selected":""}>Mestre normal</option><option value="assisted" ${r.master_mode==="assisted"?"selected":""}>Assistência de IA</option><option value="ai" ${r.master_mode==="ai"?"selected":""}>Mestre Bot IA</option></select></label><label class="publish"><input type="checkbox" data-listed="${esc(r.room_id)}" ${r.is_listed?"checked":""}> Mostrar nas salas públicas</label><button class="btn" data-save="${esc(r.room_id)}">Salvar configuração</button><button class="btn dark" data-members="${esc(r.room_id)}">👥 Gerenciar participantes</button><details class="danger-zone"><summary>Zona de perigo</summary><div class="muted">Arquivar preserva toda a campanha e permite restaurá-la depois.</div><button class="btn danger" data-archive="${esc(r.room_id)}">Arquivar campanha</button><button class="btn danger" data-delete="${esc(r.room_id)}">Excluir definitivamente</button></details></div>`}
function render(){
  $("myRooms").innerHTML=myRooms.length?myRooms.map(r=>`<article class="room ${r.room_status==="archived"?"archived":""}"><h3>${esc(r.room_name)}</h3><span class="code">${esc(r.room_code)}</span><div class="muted">${r.room_status==="archived"?"📦 Campanha arquivada":r.member_status==="pending"?"⏳ Aguardando autorização do Mestre":`${esc(mode(r.master_mode))}<br>${r.participant_count}/${r.max_participants} participantes · ${r.has_password?"🔒 Com senha":"🔓 Sem senha"}<br>${r.is_listed?"🌐 Pública":"🔒 Não listada"}<br>${r.member_role==="spectator"?`👁️ Espectador · ${r.chat_can_speak?"Chat liberado":"Chat silenciado"}`:"🎲 Jogador/Mestre"}`}</div>${r.member_status==="active"&&r.room_status!=="archived"?`<div class="actions"><button class="btn primary" data-open="${esc(r.room_id)}">Abrir Mesa</button></div>`:""}${!r.is_owner&&r.room_status!=="archived"?`<button class="btn danger" data-leave="${esc(r.room_id)}">${r.member_status==="pending"?"Cancelar solicitação":"Sair da campanha"}</button>`:""}${ownerControls(r)}</article>`).join(""):'<div class="empty">Você ainda não participa de nenhuma sala.</div>';
  $("myRooms").querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{const r=myRooms.find(x=>x.room_id===b.dataset.open);openRoom(r.room_id,r.room_name)});
  $("myRooms").querySelectorAll("[data-save]").forEach(b=>b.onclick=async()=>{b.disabled=true;fail("");try{const id=b.dataset.save,master_mode=document.querySelector(`[data-mode="${id}"]`).value,is_listed=document.querySelector(`[data-listed="${id}"]`).checked,{error}=await client.rpc("update_room_settings",{p_room_id:id,p_master_mode:master_mode,p_is_listed:is_listed});if(error)throw error;await reload()}catch(e){fail(e.message)}finally{b.disabled=false}});
  $("myRooms").querySelectorAll("[data-members]").forEach(b=>b.onclick=()=>openMembers(b.dataset.members));
  $("myRooms").querySelectorAll("[data-archive]").forEach(b=>b.onclick=async()=>{const r=myRooms.find(x=>x.room_id===b.dataset.archive);if(!confirm(`Arquivar “${r.room_name}”?\n\nA campanha ficará fechada, mas todo o conteúdo será preservado.`))return;b.disabled=true;try{const{error}=await client.rpc("archive_room",{p_room_id:r.room_id});if(error)throw error;clearActiveRoom(r.room_id);await reload()}catch(e){fail(e.message)}finally{b.disabled=false}});
  $("myRooms").querySelectorAll("[data-restore]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{const{error}=await client.rpc("restore_room",{p_room_id:b.dataset.restore});if(error)throw error;await reload()}catch(e){fail(e.message)}finally{b.disabled=false}});
  $("myRooms").querySelectorAll("[data-delete]").forEach(b=>b.onclick=async()=>{const r=myRooms.find(x=>x.room_id===b.dataset.delete),typed=prompt(`EXCLUSÃO DEFINITIVA\n\nIsso apagará mapas, tokens, cenários, rolagens e participantes.\nPara confirmar, digite exatamente o nome da campanha:\n\n${r.room_name}`);if(typed===null)return;if(typed!==r.room_name){alert("O nome digitado não corresponde. A campanha não foi excluída.");return}if(!confirm("Última confirmação: excluir esta campanha definitivamente?"))return;b.disabled=true;try{const{error}=await client.rpc("delete_room_permanently",{p_room_id:r.room_id,p_confirmation_name:typed});if(error)throw error;clearActiveRoom(r.room_id);await reload()}catch(e){fail(e.message)}finally{b.disabled=false}});
  $("myRooms").querySelectorAll("[data-leave]").forEach(b=>b.onclick=async()=>{const r=myRooms.find(x=>x.room_id===b.dataset.leave),pending=r.member_status==="pending";if(!confirm(pending?`Cancelar sua solicitação para entrar em “${r.room_name}”?`:`Sair de “${r.room_name}”?\n\nSua ficha pessoal será preservada. Para voltar, você precisará solicitar entrada novamente.`))return;b.disabled=true;try{const{error}=await client.rpc("leave_room",{p_room_id:r.room_id});if(error)throw error;clearActiveRoom(r.room_id);await reload()}catch(e){fail(e.message)}finally{b.disabled=false}});
  const available=publicRooms.filter(r=>!r.already_joined&&r.membership_status!=="pending");$("publicRooms").innerHTML=available.length?available.map(r=>`<article class="room"><h3>${esc(r.room_name)}</h3><div class="muted">${esc(mode(r.master_mode))}<br>${r.participant_count}/${r.max_participants} participantes · ${r.has_password?"🔒 Com senha":"🔓 Sem senha"}</div><button class="btn primary" data-join="${esc(r.room_code)}" data-locked="${r.has_password?"1":"0"}">Solicitar entrada</button></article>`).join(""):'<div class="empty">Nenhuma outra sala pública disponível.</div>';
  $("publicRooms").querySelectorAll("[data-join]").forEach(b=>b.onclick=async()=>{b.disabled=true;fail("");try{await join(b.dataset.join,b.dataset.locked==="1")}catch(e){fail(e.message)}finally{b.disabled=false}});
  $("legacy").innerHTML=profile?.role==="master"?'<div class="notice"><b>Mesa anterior preservada</b><br><button class="btn dark" id="legacyOpen">Abrir Mesa atual (legado)</button></div>':"";$("legacyOpen")?.addEventListener("click",()=>openRoom(LEGACY,"Mesa atual"));
}
function clearActiveRoom(roomId){try{const active=JSON.parse(localStorage.getItem(STORE)||"null");if(active?.roomId===roomId)localStorage.removeItem(STORE)}catch(_e){localStorage.removeItem(STORE)}}
async function memberAction(roomId,userId,action){const{error}=await client.rpc("moderate_room_member",{p_room_id:roomId,p_user_id:userId,p_action:action});if(error)throw error;await openMembers(roomId);await reload()}
async function openMembers(roomId){const room=myRooms.find(r=>r.room_id===roomId),{data,error}=await client.rpc("list_room_members",{p_room_id:roomId});if(error){fail(error.message);return}$("memberTitle").textContent=`👥 ${room?.room_name||"Participantes"}`;$("memberList").innerHTML=(data||[]).map(m=>`<article class="member-row"><b>${esc(m.display_name)}</b><br><small>${m.member_status==="pending"?"⏳ Solicitando entrada":m.member_status==="blocked"?"🚫 Bloqueado":m.member_role==="spectator"?`👁️ Espectador · ${m.chat_can_speak?"pode falar no chat":"chat silenciado"}`:`🎲 ${m.member_role}`}</small>${m.member_role==="owner"?"":`<div class="actions" data-member-user="${esc(m.user_id)}">${m.member_status==="pending"?`<button class="btn primary" data-act="approve">Aprovar como espectador</button><button class="btn" data-act="reject">Recusar</button><button class="btn danger" data-act="block">Bloquear</button>`:m.member_status==="blocked"?"Bloqueado":`<button class="btn" data-act="${m.member_role==="spectator"?"promote":"spectate"}">${m.member_role==="spectator"?"Tornar Jogador":"Tornar Espectador"}</button><button class="btn" data-act="${m.chat_can_speak?"mute_chat":"allow_chat"}">${m.chat_can_speak?"Silenciar chat":"Liberar chat"}</button><button class="btn danger" data-act="expel">Expulsar</button><button class="btn danger" data-act="block">Bloquear</button>`}</div>`}</article>`).join("")||"Nenhum participante.";$("memberList").querySelectorAll("[data-act]").forEach(b=>{const userId=b.closest("[data-member-user]")?.dataset.memberUser;b.onclick=async()=>{b.disabled=true;try{await memberAction(roomId,userId,b.dataset.act)}catch(e){fail(e.message)}finally{b.disabled=false}}});$("memberOverlay").hidden=false}
$("closeMembers").onclick=()=>$("memberOverlay").hidden=true;
async function checkPending(){if(!$("memberOverlay").hidden)return;for(const room of myRooms.filter(r=>r.is_owner)){const{data}=await client.rpc("list_room_members",{p_room_id:room.room_id}),pending=(data||[]).find(m=>m.member_status==="pending");if(pending){const key=`${room.room_id}:${pending.user_id}`;if(key!==pendingNotice){pendingNotice=key;await openMembers(room.room_id)}return}}pendingNotice=""}
async function reload(){const[a,b]=await Promise.all([client.rpc("list_my_rooms"),client.rpc("list_public_rooms")]);if(a.error)throw a.error;if(b.error)throw b.error;myRooms=a.data||[];publicRooms=b.data||[];render()}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{const c=b.dataset.tab==="create";$("create").hidden=!c;$("join").hidden=c;document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("primary",x===b));fail("")});
$("create").onsubmit=async e=>{e.preventDefault();fail("");const f=new FormData(e.currentTarget),b=e.submitter;b.disabled=true;try{const{data,error}=await client.rpc("create_room",{p_name:f.get("name"),p_max_participants:+f.get("limit"),p_password:f.get("password")||null,p_master_mode:f.get("mode")});if(error)throw error;if(data?.[0])openRoom(data[0].room_id,f.get("name"))}catch(x){fail(x.message)}finally{b.disabled=false}};
$("join").onsubmit=async e=>{e.preventDefault();fail("");const f=new FormData(e.currentTarget),b=e.submitter;b.disabled=true;try{await join(String(f.get("code")||"").trim(),false,f.get("password")||null)}catch(x){fail(x.message)}finally{b.disabled=false}};
$("logout").onclick=async()=>{await client.auth.signOut();location.href="index.html"};
try{const{data:{session}}=await client.auth.getSession();if(!session)location.href="index.html";else{const{data,error}=await client.from("profiles").select("username,display_name,role,approved").eq("id",session.user.id).single();if(error)throw error;profile=data;if(!profile.approved&&profile.role!=="master")location.href="index.html";else{$("welcome").textContent=`Olá, ${profile.display_name||profile.username}. Escolha onde sua aventura continua.`;await reload();await checkPending();setInterval(async()=>{try{await reload();await checkPending()}catch(_e){}},5000);$("loading").hidden=true}}}catch(x){$("loading").textContent="Não foi possível carregar o Lobby.";fail(x.message)}
</script></body></html>
