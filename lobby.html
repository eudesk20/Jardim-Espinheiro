<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>MICROCOSMOS — Lobby</title>
<style>:root{--paper:#efe5cc;--paper2:#fff8e7;--ink:#30271e;--leaf:#356342;--gold:#b58a3d;--line:#8c7552;--dark:#25283d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,"Times New Roman",serif;background:radial-gradient(circle at 50% 0,#294536,#07100b 72%);color:var(--ink)}button,input,select{font:inherit}.app{width:min(920px,100%);margin:auto;padding:14px}.head,.panel{background:var(--paper);border:4px double #9a7844;border-radius:22px;padding:16px;box-shadow:0 16px 50px #0008}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.head h1{margin:0;color:#405d3e;font-size:clamp(1.45rem,5vw,2.25rem)}.head-actions,.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--paper2);color:var(--ink);font-weight:bold;text-decoration:none;cursor:pointer}.btn.primary{background:var(--leaf);color:#fff}.btn.dark{background:var(--dark);color:#fff}.panel{margin-top:12px}.room-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:10px;margin:12px 0}.room{background:var(--paper2);border:2px solid #aa9472;border-radius:15px;padding:12px;display:grid;gap:8px}.room h3{margin:0;color:#405d3e}.code{font-family:monospace;letter-spacing:.1em;background:#ead9b5;border-radius:7px;padding:3px 7px;width:max-content}.muted{color:#75654e;font-size:.82rem}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.form[hidden]{display:none!important}.form label{display:grid;gap:4px}.wide{grid-column:1/-1}.form input,.form select{width:100%;padding:11px;border:1px solid #9c8765;border-radius:10px;background:#fffaf0}.error{color:#913f3d;font-weight:bold;min-height:1.3em;margin-top:8px}.empty{text-align:center;padding:18px;background:#fff8e7;border-radius:12px}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#07100b;color:#f3dfaa;font-size:1.2rem;z-index:20}.loading[hidden]{display:none}.notice{background:#fff4d7;border-left:5px solid var(--gold);padding:9px;border-radius:8px;margin:10px 0}@media(max-width:620px){.app{padding:7px}.head{align-items:flex-start;border-radius:16px}.panel{padding:12px;border-radius:16px}.form{grid-template-columns:1fr}.wide{grid-column:auto}.room-list{grid-template-columns:1fr}.btn{min-height:44px}.actions .btn{flex:1}}</style></head>
<body><div id="loading" class="loading">🏰 Carregando suas campanhas…</div><main class="app"><header class="head"><div><h1>🏰 Lobby de Campanhas</h1><div id="welcome" class="muted">Escolha onde sua aventura continua.</div></div><div class="head-actions"><a class="btn" href="index.html?from=lobby">📜 Minha ficha</a><button class="btn" id="logout">Sair</button></div></header><section class="panel"><h2>Suas salas</h2><div id="rooms" class="room-list"></div><div id="legacy"></div></section><section class="panel"><div class="tabs"><button class="btn primary" data-tab="create">＋ Criar sala</button><button class="btn" data-tab="join">🔑 Entrar com código</button></div><form id="create" class="form"><label class="wide">Nome da sala<input name="name" required minlength="2" maxlength="80" placeholder="Ex.: A Torre do Vale"></label><label>Limite de pessoas<input name="limit" type="number" min="1" max="30" value="6"></label><label>Senha opcional<input name="password" type="password" minlength="4" autocomplete="new-password"></label><label class="wide">Quem conduz<select name="mode"><option value="human">Mestre humano</option><option value="assisted">Mestre com ajuda da IA</option><option value="ai">Mestre Bot com IA — será ativado depois</option></select></label><button class="btn primary wide" type="submit">Criar sala</button></form><form id="join" class="form" hidden><label>Código da sala<input name="code" required maxlength="12" autocomplete="off" placeholder="Ex.: A1B2C3D4"></label><label>Senha, se houver<input name="password" type="password" autocomplete="current-password"></label><button class="btn primary wide" type="submit">Entrar na sala</button></form><div id="error" class="error"></div></section></main>
<script type="module">import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";const URL="https://evyhhlbvhspiuwouivbb.supabase.co",KEY="sb_publishable_mf7PV03HfaJw_YkUhX34NA_dAGFbyp6",STORE="MICROCOSMOS_ACTIVE_ROOM_V1",LEGACY="microcosmos-main",client=createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}),$=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),mode=m=>m==="ai"?"Mestre Bot IA":m==="assisted"?"Mestre + ajuda da IA":"Mestre humano";let profile,rooms=[];const fail=m=>$("error").textContent=m||"";function openRoom(id){localStorage.setItem(STORE,JSON.stringify({roomId:id}));location.href="mesa-campanha.html"}function render(){$("rooms").innerHTML=rooms.length?rooms.map(r=>`<article class="room"><h3>${esc(r.room_name)}</h3><span class="code">${esc(r.room_code)}</span><div class="muted">${esc(mode(r.master_mode))}<br>${r.participant_count}/${r.max_participants} participantes · ${r.has_password?"🔒 Com senha":"Sem senha"}</div><div class="actions"><button class="btn primary" data-open="${esc(r.room_id)}">Abrir Mesa</button></div></article>`).join(""):'<div class="empty">Você ainda não participa de nenhuma sala.<br><small>Crie uma campanha ou entre usando um código.</small></div>';$("rooms").querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openRoom(b.dataset.open));$("legacy").innerHTML=profile?.role==="master"?'<div class="notice"><b>Mesa anterior preservada</b><br><small>Use este acesso enquanto transfere sua campanha antiga.</small><br><button class="btn dark" id="legacyOpen">Abrir Mesa atual (legado)</button></div>':"";$("legacyOpen")?.addEventListener("click",()=>openRoom(LEGACY))}async function reload(){const{data,error}=await client.rpc("list_my_rooms");if(error)throw error;rooms=data||[];render()}document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{const c=b.dataset.tab==="create";$("create").hidden=!c;$("join").hidden=c;document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("primary",x===b));fail("")});$("create").onsubmit=async e=>{e.preventDefault();fail("");const f=new FormData(e.currentTarget),b=e.submitter;b.disabled=true;try{const{data,error}=await client.rpc("create_room",{p_name:f.get("name"),p_max_participants:+f.get("limit"),p_password:f.get("password")||null,p_master_mode:f.get("mode")});if(error)throw error;if(data?.[0]?.room_id)openRoom(data[0].room_id)}catch(x){fail(x.message)}finally{b.disabled=false}};$("join").onsubmit=async e=>{e.preventDefault();fail("");const f=new FormData(e.currentTarget),b=e.submitter;b.disabled=true;try{const{data,error}=await client.rpc("join_room",{p_room_code:String(f.get("code")||"").trim(),p_password:f.get("password")||null});if(error)throw error;if(data?.[0]?.room_id)openRoom(data[0].room_id)}catch(x){fail(x.message)}finally{b.disabled=false}};$("logout").onclick=async()=>{await client.auth.signOut();location.href="index.html"};try{const{data:{session}}=await client.auth.getSession();if(!session)location.href="index.html";else{const{data,error}=await client.from("profiles").select("username,display_name,role,approved").eq("id",session.user.id).single();if(error)throw error;profile=data;if(!profile.approved&&profile.role!=="master")location.href="index.html";else{$("welcome").textContent=`Olá, ${profile.display_name||profile.username}. Escolha onde sua aventura continua.`;await reload();$("loading").hidden=true}}}catch(x){$("loading").textContent="Não foi possível carregar o Lobby.";fail(x.message)}</script></body></html>
