<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Microcosmos — Onde o Mundo Termina</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <h1>MICROCOSMOS</h1>
    <p>Onde o Mundo Termina</p>

    <p>Ficha Online</p>

<div class="ficha-personagem">

    <h2>Ficha do Personagem</h2>

    <label for="nome-personagem">Nome</label>
    <input
        type="text"
        id="nome-personagem"
        placeholder="Nome do personagem"
    >

    <p>Nível: <span id="nivel">1</span></p>

    <div class="pontos-vida">

        <h3>Pontos de Vida</h3>

        <button id="diminuir-pv">-</button>

        <span id="pv-atual">10</span>
        /
        <span id="pv-maximo">10</span>

        <button id="aumentar-pv">+</button>

    </div>

    <h3>Atributos</h3>

    <p>Força: <span id="forca">10</span></p>
    <p>Destreza: <span id="destreza">10</span></p>
    <p>Inteligência: <span id="inteligencia">10</span></p>

</div>
<script src="js/app.js"></script>
</body>

</html>
