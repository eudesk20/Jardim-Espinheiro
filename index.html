<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Microcosmos — Onde o Mundo Termina</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <h1>MICROCOSMOS</h1>
    <p>Onde o Mundo Termina</p>

    <p>Ficha Online</p>

<div class="ficha-personagem">

    <h2>Ficha do Personagem</h2>

    <label for="nome-personagem">Nome</label>
    <input
        type="text"
        id="nome-personagem"
        placeholder="Nome do personagem"
    >

    <p>Nível: <span id="nivel">1</span></p>

    <div class="pontos-vida">

        <h3>Pontos de Vida</h3>

        <button id="diminuir-pv">-</button>

        <span id="pv-atual">10</span>
        /
        <span id="pv-maximo">10</span>

        <button id="aumentar-pv">+</button>

    </div>
<!-- ==================================================
     Atributos
     ================================================== -->
<h3>Atributos</h3>

<p>
    Força:
    <button class="botao-atributo" data-atributo="forca" data-valor="-1">-</button>
    <span id="forca">10</span>
    <button class="botao-atributo" data-atributo="forca" data-valor="1">+</button>
    <span id="modificador-forca">+0</span>
</p>

<p>
    Destreza:
    <button class="botao-atributo" data-atributo="destreza" data-valor="-1">-</button>
    <span id="destreza">10</span>
    <button class="botao-atributo" data-atributo="destreza" data-valor="1">+</button>
    <span id="modificador-destreza">+0</span>
</p>

<p>
    Constituição:
    <button class="botao-atributo" data-atributo="constituicao" data-valor="-1">-</button>
    <span id="constituicao">10</span>
    <button class="botao-atributo" data-atributo="constituicao" data-valor="1">+</button>
    <span id="modificador-constituicao">+0</span>
</p>

<p>
    Inteligência:
    <button class="botao-atributo" data-atributo="inteligencia" data-valor="-1">-</button>
    <span id="inteligencia">10</span>
    <button class="botao-atributo" data-atributo="inteligencia" data-valor="1">+</button>
    <span id="modificador-inteligencia">+0</span>
</p>

<p>
    Sabedoria:
    <button class="botao-atributo" data-atributo="sabedoria" data-valor="-1">-</button>
    <span id="sabedoria">10</span>
    <button class="botao-atributo" data-atributo="sabedoria" data-valor="1">+</button>
    <span id="modificador-sabedoria">+0</span>
</p>

<p>
    Carisma:
    <button class="botao-atributo" data-atributo="carisma" data-valor="-1">-</button>
    <span id="carisma">10</span>
    <button class="botao-atributo" data-atributo="carisma" data-valor="1">+</button>
    <span id="modificador-carisma">+0</span>
</p>

<!-- ==================================================
     PERÍCIAS
     ================================================== -->

<h3>Perícias</h3>

<p>
    Atletismo (Força):
    <span class="valor-pericia" data-atributo="forca" id="atletismo">+0</span>
</p>
</div>
<script src="js/app.js"></script>
</body>

</html>
