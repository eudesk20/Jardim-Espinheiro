name: Auditar conteúdo editorial

on:
  push:
    branches:
      - main
    paths:
      - "tools/audit-content-ip.mjs"
      - "codex-revisao/spell-data.js"
      - ".github/workflows/material-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: material-audit
  cancel-in-progress: true

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verificar inventário editorial
        run: node tools/audit-content-ip.mjs && git diff --exit-code -- CONTENT_INVENTORY.md
